  const pin=br.map(b=>st.staff.filter(p=>p.role!=='PT'&&ok(p)&&p.branch===b.id));
  const tgt=br.map((b,i)=>Math.max(0,(+b.ft||0)-pin[i].length));let extra=total-tgt.reduce((a,b)=>a+b,0);
  const order=br.map((b,i)=>i).filter(i=>!pin[i].length).sort((a,b)=>tgt[b]-tgt[a]);let oi=0;
  while(extra>0&&order.length){tgt[order[oi%order.length]]++;oi++;extra--}
  const T=tgt.reduce((a,b)=>a+b,0)||1;
  const needS=br.map((b,i)=>tgt[i]&&!pin[i].some(p=>p.role==='B')?1:0);
  const raw=tgt.map(t=>t*seniors.length/T);let sq=raw.map((r,i)=>Math.min(tgt[i],Math.max(needS[i],Math.floor(r))));
  let left=seniors.length-sq.reduce((a,b)=>a+b,0);
  const rem=raw.map((r,i)=>[r-Math.floor(r),i]).sort((a,b)=>b[0]-a[0]);
  for(let k=0;left>0&&k<rem.length*3;k++){const i=rem[k%rem.length][1];if(sq[i]<tgt[i]){sq[i]++;left--}}
  let si=0,ji=0;
  br.forEach((b,i)=>{for(let k=0;k<sq[i]&&si<seniors.length;k++)seniors[si++].branch=b.id});
  br.forEach((b,i)=>{for(let k=sq[i];k<tgt[i]&&ji<juniors.length;k++)juniors[ji++].branch=b.id});
  while(si<seniors.length)seniors[si++].branch=br[0]?.id||'';
  while(ji<juniors.length)juniors[ji++].branch=br[0]?.id||'';
  br.forEach(b=>{const n=st.staff.filter(p=>p.branch===b.id&&p.role!=='PT').length;b.min=Math.max(1,n-Math.ceil(n/5))});
}

const homeShift=p=>{const b=brOf(p.branch),sh=b&&b.shifts||[];if(!sh.length)return'';const i=ftIn(p.branch).indexOf(p);return sh[(i<0?0:i)%sh.length]};

function check(p,d,code){

  if(k==='D'){const wk=weekKey(d);for(let i=0;i<7;i++){const x=addDays(wk,i);if(x!==d&&L(p.id,x)==='D'){block.push('สัปดาห์นี้หยุดประจำแล้ว ('+thDate(x)+')');break}}
    const c=cnt(p.id,y+'-'+pad(m),'D',d);if(c>=S.set.wpm)warn.push('เดือนนี้หยุดประจำครบ '+S.set.wpm+' วันแล้ว')}
  if(k==='P'){const q=quotaPY(y),u=cnt(p.id,y+'','P',d);if(u>=q)warn.push('ใช้ P ปีนี้ครบสิทธิ์ '+q+' วันแล้ว')}
  if(k!=='P'&&p.role!=='PT'){const a=area(p.branch),cap=capOf(a),o=offArea(a,d,p.id);if(o+1>cap)block.push('วันนี้หยุดเต็มแล้ว: '+AREA[a]+' หยุดได้ '+cap+' คน/วัน (ไม่นับ P)')}
  if(k==='SH'){const n=+code.split('-')[1];if(n===m)block.push('ต้องเป็นวันหยุดพิเศษของเดือนที่ผ่านมา')}
  if(k==='LA'&&cnt(p.id,y+'','LA',d)>=S.set.laQ)warn.push('ลากิจปีนี้เกินโควตา '+S.set.laQ+' วัน');

  return{block,warn};
}

function pickDay(p,b,cands,pi,bi){const a=area(p.branch);
  const sc=s=>offArea(a,s)*10-duty(b.id,s)*3+(wdOf(s)%6===0?5:0)+(((wdOf(s)+6)%7-(pi+bi*2)%5+7)%7)*.1;
  return cands.sort((x,z)=>sc(x)-sc(z))[0]}
function fixRuns(days,quiet){
  let fixed=0;const left=[];
  for(const d of days){for(const R of S.branches.filter(b=>b.maxRun)){
    for(const A of S.staff.filter(p=>p.role!=='PT'&&worksAt(p,d,R.id))){
      if(A.fixed||runAt(A,d,R.id)<=R.maxRun)continue;
      const sA=shiftOf(A,d);
      const cands=S.staff.filter(B=>B.role!=='PT'&&!B.fixed&&B.id!==A.id&&!L(B.id,d)&&d>=S.set.planStart&&eff(B,d)!==R.id&&area(eff(B,d))===area(R.id)).filter(B=>{
        const X=brOf(eff(B,d));if(!X)return false;
        if(X.maxRun&&runIf(A,d,X.id)>X.maxRun)return false;
        return runIf(B,d,R.id)<=R.maxRun});
      cands.sort((x,z)=>((x.role===A.role?0:2)+(brOf(eff(x,d)).maxRun?1:0)+(eff(x,d)===x.branch?0:1))-((z.role===A.role?0:2)+(brOf(eff(z,d)).maxRun?1:0)+(eff(z,d)===z.branch?0:1)));
      const B=cands[0];if(!B){left.push(A.nick+' '+thDate(d));continue}
      const X=eff(B,d),sB=shiftOf(B,d);
      setAssign(A,d,X,sB);setAssign(B,d,R.id,sA);fixed++;
    }}}
  if(!quiet){render();toast(fixed?'สลับสาขาให้ '+fixed+' ครั้ง'+(left.length?' · ยังแก้ไม่ได้: '+left.slice(0,4).join(', '):' · ไม่มีใครยืนติดกันเกินกำหนดแล้ว'):left.length?'แก้ไม่ได้: '+left.slice(0,4).join(', '):'ไม่มีใครยืนติดกันเกินกำหนด')}
  return{fixed,left};
}
function fillShort(days){
  let moved=0;const left=[];
  for(const d of days){for(const R of S.branches){let guard=0;
    while(duty(R.id,d)<R.min&&guard++<10){
      const donors=S.staff.filter(B=>B.role!=='PT'&&!B.fixed&&!L(B.id,d)&&eff(B,d)!==R.id&&area(eff(B,d))===area(R.id)).filter(B=>{const X=brOf(eff(B,d));return X&&duty(X.id,d)-1>=X.min&&!checkMove(B,d,R.id).length});
      donors.sort((x,z)=>(duty(eff(z,d),d)-brOf(eff(z,d)).min)-(duty(eff(x,d),d)-brOf(eff(x,d)).min)||(x.role==='B'?0:1)-(z.role==='B'?0:1));
      const B=donors[0];if(!B){left.push(R.name+' '+thDate(d));break}
      setAssign(B,d,R.id,(R.shifts||[])[0]||'');moved++}}}
  return{moved,left};
}
function autoWeek(){
  const days=[...Array(7)].map((_,i)=>addDays(V.wk,i)),changes=[],missed=[];
  const brs=V.wb==='all'?S.branches:S.branches.filter(b=>b.id===V.wb),list=[];
  brs.forEach((b,bi)=>ftIn(b.id).forEach((p,pi)=>list.push([p,b,pi,bi])));
  list.sort((x,z)=>ftIn(x[1].id).length-ftIn(z[1].id).length);
  for(const[p,b,pi,bi]of list){if(days.some(s=>L(p.id,s)==='D'))continue;
    const c=days.filter(s=>!L(p.id,s)&&!check(p,s,'D').block.length);
    if(!c.length){missed.push(p.nick);continue}
    const pick=pickDay(p,b,c,pi,bi);S.leaves[p.id+'|'+pick]='D';changes.push([p.id,pick])}
  changes.forEach(([pid,d])=>delete S.leaves[pid+'|'+d]);setCells(changes.map(([pid,d])=>[pid,d,'D']));
  const fr=fixRuns(days,true),fs=fillShort(days);
  render();toast('ลง D ให้ '+changes.length+' คน'+(missed.length?' · หาวันไม่ได้: '+missed.join(', '):' · ทุกคนได้หยุดครบสัปดาห์นี้')+(fr.fixed?' · สลับสาขาไม่ให้ยืนติดกันเกินกำหนด '+fr.fixed+' ครั้ง':'')+(fs.moved?' · ย้ายคนไปช่วยสาขาที่คนไม่พอ '+fs.moved+' ครั้ง':'')+(fs.left.length?' · ยังขาดคน: '+fs.left.slice(0,3).join(', '):''));
}
function autoW(){
  const{y,m}=V,n=dim(y,m),pre=y+'-'+pad(m),changes=[],missed=new Set();
  const weeks=[...new Set([...Array(n)].map((_,i)=>weekKey(ds(y,m,i+1))))];
  const brs=V.branch==='all'?S.branches:S.branches.filter(b=>b.id===V.branch);
  brs.forEach((b,bi)=>ftIn(b.id).forEach((p,pi)=>{
    let c=cnt(p.id,pre,'D');
    for(const wk of weeks){if(c>=S.set.wpm)break;const wd=[...Array(7)].map((_,i)=>addDays(wk,i));
      if(wd.some(s=>L(p.id,s)==='D'))continue;
      const cand=wd.filter(s=>s.startsWith(pre)&&!L(p.id,s)&&!check(p,s,'D').block.length);
      if(!cand.length){missed.add(p.nick);continue}
      const pick=pickDay(p,b,cand,pi,bi);
      S.leaves[p.id+'|'+pick]='D';changes.push([p.id,pick]);c++}
  }));
  changes.forEach(([pid,d])=>delete S.leaves[pid+'|'+d]);setCells(changes.map(([pid,d])=>[pid,d,'D']));
  render();toast('ลง D ให้ '+changes.length+' ช่อง'+(missed.size?' · หาวันไม่ได้บางสัปดาห์: '+[...missed].slice(0,5).join(', '):''));
}

root.addEventListener('dragend',()=>{drag=null;document.querySelectorAll('.sg.over').forEach(x=>x.classList.remove('over'))});
root.addEventListener('keydown',e=>{const rc=e.target.closest?.('td.rc');if(rc&&e.key==='Enter'&&!readOnly){e.preventDefault();openResp(rc);return}
  const pc=e.target.closest?.('.pc');if(pc&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openPop(pc);return}
  const c=e.target.closest?.('td.c');if(!c)return;
  if(e.key==='Enter'||e.key===' '){e.preventDefault();openPop(c)}
  if((e.key==='Delete'||e.key==='Backspace')&&!readOnly&&L(c.dataset.p,c.dataset.d)){setCells([[c.dataset.p,c.dataset.d,'']]);render();document.querySelector(`.c[data-p="${c.dataset.p}"][data-d="${c.dataset.d}"]`)?.focus()}});
root.addEventListener('input',e=>{if(e.target.id!=='who')return;const q=e.target.value.trim();
  document.querySelectorAll('.w [data-n]').forEach(x=>{const hit=q&&x.dataset.n.includes(q);x.classList.toggle('hl',!!hit);x.classList.toggle('dim',!!q&&!hit)})});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TK.includes(h)&&h!==tab){tab=h;closePop();render()}});
document.addEventListener('mousedown',e=>{if(pop&&!pop.contains(e.target)&&!e.target.closest('td.c'))closePop()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePop()});
addEventListener('resize',closePop);

render();
if(window.claude&&window.claude.use)window.claude.use('artifact').then(a=>{ART=a}).catch(()=>{});
}</script></body></html>
